version: '3.7'

services: 
 mysql:
  image: mysql:8
  container_name: mysql
  volumes:
   - db:/var/lib/mysql

  ports:
  environment:
  network:
   - primeira-network

api-davi:
 build:
  context: .
  container_name: api-davi
 ports:
  - 3001:3000
 depends_on:
  - mysql
 networks:
  - primeira-network  

networks:
 - primeira-network:
     name: primeira-network
     external: true
     driver: bridge

volumes:
 db:     