name: CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - "Dockerfile"
      - ".github/workflows/ci-cd.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPO_DEV: dev-davops-api
  ECR_REPO_PROD: prod-davops-api
  APP_RUNNER_SERVICE_DEV: dev-davops-api
  APP_RUNNER_SERVICE_PROD: prod-davops-api

jobs:

  test:
    name: "Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  build-and-push-dev:
    name: "Build and Push Dev"
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "image_tag=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::261597939254:role/dev-ecr-role

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push image
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_DEV }}:${{ steps.vars.outputs.image_tag }}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

  deploy-dev:
    name: "Deploy Dev"
    runs-on: ubuntu-latest
    needs: build-and-push-dev

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::261597939254:role/dev-ecr-role

      - name: Deploy to AppRunner Dev
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE_DEV }}'].ServiceArn" \
            --output text \
            --region ${{ env.AWS_REGION }})

          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            echo "App Runner service '${{ env.APP_RUNNER_SERVICE_DEV }}' was not found in region '${{ env.AWS_REGION }}'."
            echo "Check whether the Terraform project has been applied and whether the service name matches the workflow."
            exit 1
          fi
          
          aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --source-configuration "{\"ImageRepository\":{\"ImageIdentifier\":\"261597939254.dkr.ecr.us-east-2.amazonaws.com/${{ env.ECR_REPO_DEV }}:${{ needs.build-and-push-dev.outputs.image_tag }}\",\"ImageRepositoryType\":\"ECR\",\"ImageConfiguration\":{\"Port\":\"8000\"}},\"AuthenticationConfiguration\":{\"AccessRoleArn\":\"arn:aws:iam::261597939254:role/dev-app-runner-role\"}}" \
            --region ${{ env.AWS_REGION }}

  health-check-dev:
    name: "Health Check Dev"
    runs-on: ubuntu-latest
    needs: deploy-dev

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::261597939254:role/dev-ecr-role

      - name: Get AppRunner URL
        id: get-url
        run: |
          URL=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE_DEV }}'].ServiceUrl" \
            --output text \
            --region ${{ env.AWS_REGION }})

          if [ -z "$URL" ] || [ "$URL" = "None" ]; then
            echo "App Runner service '${{ env.APP_RUNNER_SERVICE_DEV }}' URL was not found in region '${{ env.AWS_REGION }}'."
            exit 1
          fi

          echo "url=https://$URL" >> $GITHUB_OUTPUT

      - name: Wait for deploy
        run: sleep 60

      - name: Check health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.get-url.outputs.url }}/health)
          if [ $STATUS -ne 200 ]; then
            echo "❌ Health check falhou! Status: $STATUS"
            exit 1
          fi
          echo "✅ Health check passou! Status: $STATUS"

  build-and-push-prod:
    name: "Build and Push Prod"
    runs-on: ubuntu-latest
    needs: health-check-dev
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "image_tag=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::261597939254:role/prod-ecr-role

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push image
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_PROD }}:${{ steps.vars.outputs.image_tag }}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

  deploy-prod:
    name: "Deploy Prod"
    runs-on: ubuntu-latest
    needs: build-and-push-prod

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::261597939254:role/prod-ecr-role

      - name: Deploy to AppRunner Prod
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE_PROD }}'].ServiceArn" \
            --output text \
            --region ${{ env.AWS_REGION }})

          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            echo "App Runner service '${{ env.APP_RUNNER_SERVICE_PROD }}' was not found in region '${{ env.AWS_REGION }}'."
            echo "Check whether the Terraform project has been applied and whether the service name matches the workflow."
            exit 1
          fi

          aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --source-configuration "{\"ImageRepository\":{\"ImageIdentifier\":\"261597939254.dkr.ecr.us-east-2.amazonaws.com/${{ env.ECR_REPO_PROD }}:${{ needs.build-and-push-prod.outputs.image_tag }}\",\"ImageRepositoryType\":\"ECR\",\"ImageConfiguration\":{\"Port\":\"8000\"}},\"AuthenticationConfiguration\":{\"AccessRoleArn\":\"arn:aws:iam::261597939254:role/prod-app-runner-role\"}}" \
            --region ${{ env.AWS_REGION }}
