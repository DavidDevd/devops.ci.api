name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: 'Build and push'
    runs-on: ubuntu-latest
    
    # ✅ Necessário para autenticação OIDC com a AWS
    permissions:
      id-token: write
      contents: read

    #strategy:
      #matrix:
        #node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      #- name: Setup node | ${{matrix.node}}
      - name: Setup node 
        uses: actions/setup-node@v4
        with:
          #node-version: ${{matrix.node}}
          node-version: 24
          cache: 'npm'

      - run: npm install
      - run: npm test

      - name: Generate tag
        id: generate_tag
        run: |
         SHA=$(echo $GITHUB_SHA | head -c7)
         echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::261597939254:role/ecr-role
          aws-region: us-east-2

      - name: Login aws ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      


      - name: Build docker image
        env:
          REGISTRY: ${{steps.login-ecr.outputs.registry}} 
          TAG: ${{steps.generate_tag.outputs.sha}} 
        run: |
         docker build -t $REGISTRY/davops-ci:$TAG .
         docker push $REGISTRY/davops-ci:$TAG
         

      #- name: Push image
        #run: docker push davidevv/davops-ci-api:${{steps.generate_tag.outputs.sha}}