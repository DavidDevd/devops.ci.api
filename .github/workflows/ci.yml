name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: 'Build and push'
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup node 
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm install
      - run: npm test

      - name: Generate tag
        id: generate_tag
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::261597939254:role/ecr-role
          aws-region: us-east-2

      - name: Login aws ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Build docker image
        id: build-docker-image  # ✅ CORRIGIDO: estava dentro de env (lugar errado)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }} 
          TAG: ${{ steps.generate_tag.outputs.sha }} 
        run: |
          docker build -t $REGISTRY/davops-ci:$TAG .
          docker push $REGISTRY/davops-ci:$TAG
          echo "image=$REGISTRY/davops-ci:$TAG" >> $GITHUB_OUTPUT  # ✅ CORRIGIDO: variável IMAGE desnecessária

      - name: Deploy to App Runner
        uses: awslabs/amazon-app-runner-deploy@main  # ✅ CORRIGIDO: "amazon-amazon" → "amazon"
        with:
          service: davops-api
          image: ${{ steps.build-docker-image.outputs.image }}
          access-role-arn: arn:aws:iam::261597939254:role/app-runner-role  # ✅ CORRIGIDO: "acess" → "access"
          region: us-east-2
          cpu: 1
          memory: 2
          port: 3000